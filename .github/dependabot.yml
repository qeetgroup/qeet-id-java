version: 2
# One grouped pull request a month for each ecosystem, into develop. gradle.lockfile is regenerated with the update.
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      gradle-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
