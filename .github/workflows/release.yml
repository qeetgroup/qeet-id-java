name: Release

# Publishes com.qeetgroup:qeet-id to Maven Central on merge to main, then tags the commit — the
# same release flow as the Qeetrix packages.
#
#   1. Open a PR into main. version.yml bumps the patch in gradle.properties on the PR branch;
#      raise minor or major by hand.
#   2. Merge to main. The gate job runs every check again.
#   3. The publish job runs in the `maven-central` environment (give it required reviewers to
#      approve each release). It signs and publishes through the Sonatype Central Portal, pushes
#      the vX.Y.Z tag and opens a GitHub Release. It needs the MAVEN_CENTRAL_USERNAME,
#      MAVEN_CENTRAL_PASSWORD, SIGNING_KEY and SIGNING_KEY_PASSWORD secrets and a verified
#      com.qeetgroup namespace.
#
# Re-running is safe: if the version is already on Maven Central, nothing is published. Maven
# Central never replaces a version; a bad release is followed by a fixed one.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags must be visible
          persist-credentials: false

      - id: version
        name: is there anything to release?
        run: |
          set -uo pipefail
          version=$(sed -nE 's/^version=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' gradle.properties)
          if [ -z "$version" ]; then
            echo "::error::gradle.properties has no version=X.Y.Z."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -sf -o /dev/null "https://repo1.maven.org/maven2/com/qeetgroup/qeet-id/$version/qeet-id-$version.pom"; then
            echo "com.qeetgroup:qeet-id:$version is already on Maven Central — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version exists but $version is not on Maven Central. Resolve by hand."
            exit 1
          else
            echo "com.qeetgroup:qeet-id:$version is new — releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # The same gate as CI, on the baseline JDK. Nothing below runs when the version is unchanged.
      - if: steps.version.outputs.release == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25
      - if: steps.version.outputs.release == 'true'
        uses: gradle/actions/setup-gradle@v6
      - if: steps.version.outputs.release == 'true'
        run: ./gradlew build javadoc -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_25_X64

      - if: steps.version.outputs.release == 'false'
        name: report that there is nothing to release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Nothing to release"
            echo
            echo "\`$VERSION\` is already on Maven Central."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maven-central
    permissions:
      contents: write # push the version tag and create the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v6

      # Uploads the signed jar, sources, Javadoc and POM to the Sonatype Central Portal and releases
      # them once Central has validated them.
      - name: publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >-
          ./gradlew publishAndReleaseToMavenCentral
          --no-configuration-cache
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_25_X64

      # Tag AFTER a successful publish, so every tag is a version that shipped.
      - name: tag the release and open a GitHub Release
        env:
          TAG: v${{ needs.gate.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes --repo "${{ github.repository }}"
