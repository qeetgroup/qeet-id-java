name: Release

# Publishes com.qeetgroup:qeet-id to GitHub Packages on merge to main, then tags the commit: the Qeetrix release flow,
# the same as Qeetrix for Android.
#
#   1. Raise `version` in gradle.properties (patch, minor or major) on develop, then open a pull request from develop
#      into main; Verify runs on it.
#   2. Merge to main. The gate job checks the version is new.
#   3. The publish job runs in the `maven-publish` environment (give it a required reviewer to approve each release). It
#      publishes with the run's own short-lived token (no stored secret), attests the build provenance, then pushes the
#      vX.Y.Z tag and opens a GitHub Release with the jars and the POM.
#   4. Bad release? A published Maven version is never replaced: a fix is a new version.
#
# Re-running is safe: if the version is already in GitHub Packages, nothing is published.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: New version, and every check passes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags must be visible
          persist-credentials: false

      - id: version
        name: Is there anything to release?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$version' in gradle.properties is not X.Y.Z."; exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' -u "$GITHUB_ACTOR:$GH_TOKEN" \
            "https://maven.pkg.github.com/$GITHUB_REPOSITORY/com/qeetgroup/qeet-id/$version/qeet-id-$version.pom")
          if [ "$status" = "200" ]; then
            echo "com.qeetgroup:qeet-id:$version is already published — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" != "404" ]; then
            echo "::error::Could not tell whether $version is published (GitHub Packages answered $status)."; exit 1
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version exists but $version is not published. Resolve by hand."; exit 1
          else
            echo "com.qeetgroup:qeet-id:$version is new — releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.release == 'false'
        name: Report that the version is unchanged
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Nothing to release"
            echo
            echo "\`$VERSION\` is already in GitHub Packages."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish ${{ needs.gate.outputs.version }}
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maven-publish
    permissions:
      contents: write # push the version tag and create the release
      packages: write # publish to GitHub Packages
      id-token: write # build provenance
      attestations: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # The same publication also goes to build/release-candidate/maven, which the GitHub Release attaches.
      - name: Publish to GitHub Packages
        env:
          ORG_GRADLE_PROJECT_registryUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_registryPassword: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew --console=plain
          publishReleasePublicationToRegistryRepository
          publishReleasePublicationToReleaseCandidateRepository
          -Pqeetid.registry.url="https://maven.pkg.github.com/$GITHUB_REPOSITORY"
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_25_X64

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build/release-candidate/maven/com/qeetgroup/qeet-id/${{ env.VERSION }}/qeet-id-${{ env.VERSION }}.jar
            build/release-candidate/maven/com/qeetgroup/qeet-id/${{ env.VERSION }}/qeet-id-${{ env.VERSION }}-sources.jar
            build/release-candidate/maven/com/qeetgroup/qeet-id/${{ env.VERSION }}/qeet-id-${{ env.VERSION }}-javadoc.jar
            build/release-candidate/maven/com/qeetgroup/qeet-id/${{ env.VERSION }}/qeet-id-${{ env.VERSION }}.pom
            build/release-candidate/maven/com/qeetgroup/qeet-id/${{ env.VERSION }}/qeet-id-${{ env.VERSION }}.module

      # Tag AFTER a successful publish, so every tag is a version that shipped.
      - name: Tag the release and open a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

          # The release notes are the version's CHANGELOG entry ("## [X.Y.Z] — date"), or GitHub's generated notes.
          awk -v v="[$VERSION]" '/^## /{on = index($0, v) > 0; next} on' CHANGELOG.md > notes.md
          dir="build/release-candidate/maven/com/qeetgroup/qeet-id/$VERSION"
          flags=()
          if [ -s notes.md ]; then flags+=(--notes-file notes.md); else flags+=(--generate-notes); fi
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" "${flags[@]}" \
            "$dir/qeet-id-$VERSION.jar" "$dir/qeet-id-$VERSION-sources.jar" "$dir/qeet-id-$VERSION-javadoc.jar" \
            "$dir/qeet-id-$VERSION.pom"
