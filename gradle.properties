# The version a local build carries. A release sets the real one from the
# vX.Y.Z tag it creates (see .github/workflows/release.yml).
version=0.1.0-SNAPSHOT

# The JDK the tests run on: 17 (the baseline) unless asked otherwise, as CI
# does with -PtestJdk=21 and -PtestJdk=25.
testJdk=17

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
