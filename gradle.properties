# The version the next release publishes. version.yml raises the patch on every PR into main
# (raise minor or major by hand); release.yml publishes it when the PR is merged.
version=0.1.0

# The JDK the tests run on: 17 (the baseline) unless asked otherwise, as CI
# does with -PtestJdk=21 and -PtestJdk=25.
testJdk=17

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
